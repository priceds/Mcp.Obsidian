name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            archive_name: Mcp.Obsidian-linux-x64.tar.gz
            binary_name: Mcp.Obsidian
          - runner: ubuntu-latest
            rid: linux-arm64
            archive_name: Mcp.Obsidian-linux-arm64.tar.gz
            binary_name: Mcp.Obsidian
          - runner: windows-latest
            rid: win-x64
            archive_name: Mcp.Obsidian-win-x64.zip
            binary_name: Mcp.Obsidian.exe
          - runner: macos-14
            rid: osx-arm64
            archive_name: Mcp.Obsidian-osx-arm64.tar.gz
            binary_name: Mcp.Obsidian

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore test dependencies
        run: dotnet restore tests/Mcp.Obsidian.Tests/Mcp.Obsidian.Tests.csproj

      - name: Test
        run: dotnet test tests/Mcp.Obsidian.Tests/Mcp.Obsidian.Tests.csproj --configuration Release --no-restore

      - name: Restore publish dependencies
        run: dotnet restore src/Mcp.Obsidian/Mcp.Obsidian.csproj --runtime ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish src/Mcp.Obsidian/Mcp.Obsidian.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:PublishTrimmed=false
          --output artifacts/${{ matrix.rid }}

      - name: Package tar.gz
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          tar -czf release/${{ matrix.archive_name }} -C artifacts/${{ matrix.rid }} .

      - name: Package zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "release/${{ matrix.archive_name }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: release/${{ matrix.archive_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/${{ matrix.archive_name }}
          fail_on_unmatched_files: true
